name: workout_log
description: "Workout Log — 무분할 40분 루틴 기반 운동 기록 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_file_dialog: ^3.3.2
  flutter_local_notifications: ^22.3.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  injectable: ^3.0.0
  intl: ^0.20.3
  receive_sharing_intent: 1.9.0
  share_plus: ^13.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.1.1
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Source art is drawn by tools/generate_icon.py — edit that, not the outputs.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#12151A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true
