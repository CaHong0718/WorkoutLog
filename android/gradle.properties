org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin plugins (share_plus, flutter_file_dialog, receive_sharing_intent)
# each apply their own Kotlin Gradle Plugin, and their incremental caches
# collide inside one daemon:
#   "Storage for [...class-fq-name-to-source.tab] is already registered"
# Verified: removing this line breaks the Android build on all three. Full
# Kotlin compilation avoids the shared cache; only these three small plugins
# are Kotlin, so the cost is a few seconds.
kotlin.incremental=false

# compileSdk 37 is newer than AGP 9.0.1 advertises support for; the warning
# is advisory and the platform is installed.
android.suppressUnsupportedCompileSdk=37
